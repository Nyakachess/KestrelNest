name: Onboarding

# Scheduled upkeep of the ladder.
# - Daily: one nudge, ever, on a Stage 1 issue that has sat for a week with no commit from
#   its assignee.
# - Every half hour, and whenever Kestrel sends a repository_dispatch of type "upkeep":
#   assign open stage issues to their owner once the owner has accepted the collaborator
#   invitation (enrolment creates the issues while the invitation is pending, and GitHub drops
#   an assignee who has no access yet), and put the current kestrel-ticket block from stages/
#   into every open stage issue whose block is out of date. Nobody has to remember to refresh.
on:
  schedule:
    - cron: '23 7 * * *'
    - cron: '7,37 * * * *'
  repository_dispatch:
    types: [upkeep]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  stale-nudge:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 7 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Nudge stale Stage 1 issues once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/stale-nudge.mjs

  stage-upkeep:
    runs-on: ubuntu-latest
    concurrency:
      group: stage-upkeep
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Assign stage issues and refresh their blocks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/stage-upkeep.mjs
