name: Onboarding

# Scheduled upkeep of the ladder. Today: one nudge, ever, on a Stage 1 issue that has sat
# for a week with no commit from its assignee.
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  stale-nudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Nudge stale Stage 1 issues once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/stale-nudge.mjs
